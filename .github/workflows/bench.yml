name: bench

# Version-specific questions against real installs of popular libraries, on a
# GitHub-hosted runner, with Context7's anonymous tier for comparison.
# Results land in the job summary and the `bench` artifact.

on:
  workflow_dispatch:
    inputs:
      context7:
        description: Also query Context7 (anonymous tier)
        type: boolean
        default: true
      variants:
        description: 'Extra configurations, space-separated name:KEY=VALUE,KEY=VALUE (e.g. head0:LOCKDOCS_HEAD_WEIGHT=0)'
        type: string
        default: ''
  pull_request:
    paths: ['bench/**', '.github/workflows/bench.yml']

permissions:
  contents: read

# One run at a time: Context7's anonymous quota is shared.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install tiktoken
      - run: cargo build --release --locked -p lockdocs
      - name: Install benchmark projects at pinned versions
        run: bash bench/setup.sh bench/projects
      - name: Download the embedding model (once, like a first run)
        run: rm -rf ~/.cache/lockdocs && mkdir -p /tmp/empty && target/release/lockdocs fetch -C /tmp/empty
      - name: Run (package files, then `lockdocs fetch` + upstream docs)
        env:
          C7: ${{ (github.event_name != 'workflow_dispatch' || inputs.context7) && '--context7' || '' }}
          VARIANTS: ${{ inputs.variants }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=()
          for v in $VARIANTS; do extra+=(--variant "$v"); done
          python3 bench/run.py target/release/lockdocs bench/projects bench.json --fetch $C7 --context7-cache docs/public/bench-results.json "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      # The cloud arm with the same corpus and grader, when a key is set: it
      # answers the cloud vertical's "one index format, local and cloud" claim
      # and its JSON feeds the cloud report (SylphxAI/cloud
      # services/ai/evals/search/evals/docs). No key means the arm is skipped,
      # never failed: this runs on a pull request with no secret.
      - name: Run the Sylphx Search cloud arm (docs vertical)
        if: env.SYLPHX_SEARCH_EVAL_KEY != ''
        env:
          SYLPHX_SEARCH_EVAL_KEY: ${{ secrets.SYLPHX_SEARCH_EVAL_KEY }}
        run: |
          set -euo pipefail
          python3 bench/cloud.py --out cloud.json --depth standard | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench
          path: |
            bench.json
            cloud.json
          if-no-files-found: ignore
