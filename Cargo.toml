[workspace]
members = ["crates/lockdocs-core", "crates/lockdocs"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["SylphxAI"]
rust-version = "1.90"
readme = "README.md"
documentation = "https://sylphxai.github.io/lockdocs/"
keywords = ["mcp", "documentation", "lockfile", "offline", "ai-agents"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/SylphxAI/lockdocs"
homepage = "https://sylphxai.github.io/lockdocs/"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3
