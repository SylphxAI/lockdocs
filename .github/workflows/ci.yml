name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plain-language:
    name: plain language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/plain-language@f9176dad2e49c6b99d75f1506fafac84632fe870 # main

  identifiers:
    name: Identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9 # main

  chat-senders:
    name: Chat senders
    # Ubuntu-hosted: this repository has never scheduled a self-hosted job and
    # the shared standard pool is congested, so a pinned self-hosted lane here
    # would sit queued and block the pull request rather than report. The fast
    # lane stays cheap enough for a hosted runner; the merge group still fails
    # the change through its own run, and a follow-up moves the lane onto the
    # standard pool once the pool serves this repository reliably.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the action diffs the merge base with the base branch, so
      # a shallow checkout would make it pass on a change it never saw.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Fails a change that adds a direct chat-API host (Telegram, Slack,
      # Discord) outside Notify. The allow-list is owned by the action.
      - uses: SylphxAI/.github/.github/actions/chat-senders@5cfd55a41435cca8e4b7caf6506faf04ca08d200 # main
        with:
          mode: fail

  stack-conformance:
    name: Stack conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: SylphxAI/.github/.github/actions/stack-conformance@badfd7af0ea30267ccd709c68df81e5b1e66d5bd # main
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event_name == 'push' && github.event.before) || '' }}
          auth-surface: full

  scope:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.paths.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the change against the tested base
        id: paths
        shell: bash
        run: |
          kind=all
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Compare the tested merge commit to its base parent. No API path
            # limits; renames count as a removal and an addition.
            paths="$RUNNER_TEMP/lockdocs-changed-paths"
            git rev-parse --verify HEAD^2 >/dev/null
            git diff --no-renames --name-only -z HEAD^1 HEAD -- > "$paths"
            kind=
            while IFS= read -r -d '' path; do
              case "$path" in
                apps/web/*|Dockerfile.web|sylphx.toml) lane=web ;;
                crates/*|Cargo.toml|Cargo.lock) lane=rust ;;
                *) lane=all ;;
              esac
              if [[ "$lane" == all || ( -n "$kind" && "$kind" != "$lane" ) ]]; then
                kind=all
                break
              fi
              kind=$lane
            done < "$paths"
          fi
          echo "kind=${kind:-all}" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: scope
    # A job-level skip would not expand the required check names. Publish the
    # three named no-op receipts on Linux for a web-only PR.
    runs-on: ${{ needs.scope.outputs.kind == 'web' && 'ubuntu-latest' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.kind != 'web'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.scope.outputs.kind != 'web'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.scope.outputs.kind != 'web'
      - run: cargo test --workspace --locked
        if: needs.scope.outputs.kind != 'web'
      - run: echo 'Web-only PR; platform Rust tests are not affected.'
        if: needs.scope.outputs.kind == 'web'

  checks:
    name: manifests, smoke, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: bun install --frozen-lockfile
      - name: Manifests agree on one version and one tagline; capability paths exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/check-version.ts
          bun scripts/check-mcp-registry.ts
          bun scripts/editor-install.ts --check
          bun scripts/check-tagline.ts "$(gh api "repos/$GITHUB_REPOSITORY" --jq .description)"
          bun scripts/check-capabilities.ts
          bun scripts/check-readme-links.ts
      - name: Benchmark graders (network-free; the corpus and the cloud arm)
        run: |
          python3 bench/test_run.py
          python3 bench/test_cloud.py
      - name: Format and lints
        run: cargo fmt --all --check && cargo clippy --workspace --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked -p lockdocs
      - name: Smoke (CLI, MCP over stdio, npm launcher)
        env:
          LOCKDOCS_NO_SYSTEM_PYTHON: '1'
          LOCKDOCS_OFFLINE: '1'
        run: |
          set -euo pipefail
          B=$PWD/target/release/lockdocs
          F=crates/lockdocs-core/tests/fixture
          $B version
          $B resolve -C $F | tee /tmp/resolve.out
          grep -q 'tinyrt@0.3.0' /tmp/resolve.out
          $B tiny-schema "reject unknown keys" -C $F | tee /tmp/docs.out
          grep -q 'tiny-schema@1.2.0 README.md:9' /tmp/docs.out
          $B api tinyrt::spawn -C $F | grep -q 'Spawns a future'
          $B api serde_json::from_str | grep -q 'serde_json@'
          $B index -C $F
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"docs","arguments":{"query":"turn a model into a dict","package":"tinymodel"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"api","arguments":{"symbol":"tinyweb.Context.JSON"}}}' \
            | (cat; sleep 2) | $B mcp -C $F > /tmp/mcp.out
          grep -q '"name":"resolve"' /tmp/mcp.out
          grep -q 'to_dict' /tmp/mcp.out
          grep -q 'JSON writes obj as JSON' /tmp/mcp.out
          HOME=$(mktemp -d) $B setup --client cursor,codex | tee /tmp/setup.out
          grep -q 'Cursor' /tmp/setup.out
          LOCKDOCS_BIN=$B node packages/lockdocs/bin/lockdocs.js version
      - name: Installed npm import and version regressions (CLI and MCP)
        run: python3 scripts/check-public-api.py target/release/lockdocs
      - name: Embedding model download, verification and hybrid query
        env:
          LOCKDOCS_NO_SYSTEM_PYTHON: '1'
        run: |
          set -euo pipefail
          B=$PWD/target/release/lockdocs
          mkdir -p /tmp/empty && $B fetch -C /tmp/empty | tee /tmp/fetch.out
          grep -q 'potion-retrieval-32M ready' /tmp/fetch.out
          $B tinymodel "turn a model into a dict" -C crates/lockdocs-core/tests/fixture | grep -q to_dict
      - name: Docs build
        run: bun run docs:build
      - name: Brand home (hashes and surface copies agree)
        uses: SylphxAI/.github/.github/actions/brand@a6c81b4bcda66bf624f0a68e25e63b3c0ed043eb # main

  web-native:
    name: Web checks and native login
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --locked -p lockdocs
      - name: Check the web app and native login
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          LOCKDOCS_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/lockdocs" npm test

  web-preview:
    name: SolidStart preview
    needs: scope
    if: needs.scope.outputs.kind != 'rust'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Verify the production server in Chromium
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx --no-install playwright install --with-deps --only-shell chromium
          npm run test:browser
      # Keep local test results on PRs; publish diagnostics only on main pushes.
      - name: Gather Chromium results
        id: chromium-results
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          # Match the previous upload: keep relative paths and skip hidden files.
          shopt -s globstar nullglob
          bundle=$(mktemp -d "$RUNNER_TEMP/lockdocs-preview-chromium.XXXXXX")
          has_results=false
          for file in apps/web/test-results/**/*; do
            [[ -f "$file" ]] || continue
            dest="$bundle/${file#apps/web/test-results/}"
            mkdir -p -- "${dest%/*}"
            cp -- "$file" "$dest"
            has_results=true
          done
          if $has_results; then echo "path=$bundle" >> "$GITHUB_OUTPUT"; fi
      - name: Store Chromium results
        if: always() && steps.chromium-results.outputs.path != ''
        uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        with:
          mode: put
          name: lockdocs-preview-chromium
          path: ${{ steps.chromium-results.outputs.path }}
          retention-days: 1

  web-container:
    name: SolidStart container
    needs: scope
    if: needs.scope.outputs.kind != 'rust'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile.web
          load: true
          tags: lockdocs-preview-check
          cache-from: type=gha,scope=lockdocs-preview
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=lockdocs-preview,mode=max' || '' }}
      - name: Verify the preview container
        run: |
          container=$(docker run -d -p 127.0.0.1::3000 lockdocs-preview-check)
          trap 'if [ "$?" -ne 0 ]; then docker logs --tail 80 "$container" >&2 || true; fi; docker rm -f "$container" >/dev/null' EXIT
          address=$(docker port "$container" 3000/tcp)
          # The published socket can reset connections before Node starts listening.
          body=$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-connrefused --retry-delay 1 --retry-max-time 15 --max-time 2 "http://$address/api/health")
          printf '%s\n' "$body" | grep -Fx '{"status":"ok"}'
      - name: Verify the Glama stdio container
        run: |
          set -euo pipefail
          docker build --file Dockerfile --tag lockdocs-mcp-check .
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | (cat; sleep 2) \
            | timeout 15 docker run --rm -i --network=none lockdocs-mcp-check \
            | jq -es '([.[] | select(.id == 1) | .result.serverInfo.name] == ["lockdocs"]) and ([.[] | select(.id == 2) | .result.tools[].name] | sort == ["api", "docs", "resolve"])'

  # The org-wide required check name: every lane passes or is skipped, except
  # chat-senders, which must actually succeed.
  ci-ok:
    if: always()
    needs: [scope, plain-language, identifiers, stack-conformance, chat-senders, test, checks, web-native, web-preview, web-container]
    # The reserved gate pool (Kueue queue scale-set-gate, never lends): an
    # `if: always()` verdict still runs after its run is cancelled, and that run
    # keeps its concurrency group until it does, so on a busy build pool a
    # superseded run held the next one (SylphxAI/agents#4222, 2026-10-02).
    runs-on: sylphx-linux-control
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@b3b5ee92780e4979f2b23a09543e3064a91ec33b # main
        with:
          needs: ${{ toJSON(needs) }}
          # Only a proven Rust-only PR may omit Chromium and Docker. The
          # native-login integration still has to exercise the same CLI.
          required: scope,plain-language,identifiers,stack-conformance,test,checks,web-native${{ needs.scope.outputs.kind != 'rust' && ',web-preview,web-container' || '' }}
      # chat-senders is never skipped, so its success is required directly:
      # on a pull request, on a merge group and on the main push alike.
      - name: Require the chat-senders proof (skipped or cancelled fails)
        env:
          CHAT_SENDERS_RESULT: ${{ needs.chat-senders.result }}
        run: test "$CHAT_SENDERS_RESULT" = success
