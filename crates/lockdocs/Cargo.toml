[package]
name = "lockdocs"
description = "Exact-version library docs from your lockfile — local, offline, no rate limits."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "lockdocs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
lockdocs-core = { path = "../lockdocs-core" }
serde_json = "1"
sylphx-mcp-kit = { git = "https://github.com/SylphxAI/mcp-kit", tag = "v0.1.0" }
