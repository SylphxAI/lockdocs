name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  plain-language:
    name: plain language
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/plain-language@f9176dad2e49c6b99d75f1506fafac84632fe870

  test:
    runs-on: sylphx-linux-standard
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked

  # Windows: the tests are cross-compiled to MSVC on Linux and run under wine.
  # No macOS lane: we host no Apple hardware yet, and the release workflow
  # checks the Apple binaries.
  windows:
    name: test windows (wine)
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows
      - name: cargo-xwin, clang and wine
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xwin.tgz" https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz
          echo "c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360  $RUNNER_TEMP/xwin.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          tar -xzf "$RUNNER_TEMP/xwin.tgz" -C "$RUNNER_TEMP/bin" cargo-xwin
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang wine wine64 >/dev/null
      - run: cargo xwin test --workspace --locked --target x86_64-pc-windows-msvc
        env:
          XWIN_ACCEPT_LICENSE: '1'
          WINEPREFIX: ${{ runner.temp }}/wine
          WINEDEBUG: -all

  checks:
    name: manifests, smoke, docs
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bun install --frozen-lockfile
      - name: Manifests agree on one version and one tagline; capability paths exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/check-version.ts
          bun scripts/check-tagline.ts "$(gh api "repos/$GITHUB_REPOSITORY" --jq .description)"
          bun scripts/check-capabilities.ts
      - name: Format and lints
        run: cargo fmt --all --check && cargo clippy --workspace --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked -p lockdocs
      - name: Smoke (CLI, MCP over stdio, npm launcher)
        env:
          LOCKDOCS_NO_SYSTEM_PYTHON: '1'
          LOCKDOCS_OFFLINE: '1'
        run: |
          set -euo pipefail
          B=$PWD/target/release/lockdocs
          F=crates/lockdocs-core/tests/fixture
          $B version
          $B resolve -C $F | tee /tmp/resolve.out
          grep -q 'tinyrt@0.3.0' /tmp/resolve.out
          $B tiny-schema "reject unknown keys" -C $F | tee /tmp/docs.out
          grep -q 'tiny-schema@1.2.0 README.md:9' /tmp/docs.out
          $B api tinyrt::spawn -C $F | grep -q 'Spawns a future'
          $B api serde_json::from_str | grep -q 'serde_json@'
          $B index -C $F
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"docs","arguments":{"query":"turn a model into a dict","package":"tinymodel"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"api","arguments":{"symbol":"tinyweb.Context.JSON"}}}' \
            | (cat; sleep 2) | $B mcp -C $F > /tmp/mcp.out
          grep -q '"name":"resolve"' /tmp/mcp.out
          grep -q 'to_dict' /tmp/mcp.out
          grep -q 'JSON writes obj as JSON' /tmp/mcp.out
          HOME=$(mktemp -d) $B setup --client cursor,codex | tee /tmp/setup.out
          grep -q 'Cursor' /tmp/setup.out
          LOCKDOCS_BIN=$B node packages/lockdocs/bin/lockdocs.js version
      - name: Embedding model download, verification and hybrid query
        env:
          LOCKDOCS_NO_SYSTEM_PYTHON: '1'
        run: |
          set -euo pipefail
          B=$PWD/target/release/lockdocs
          mkdir -p /tmp/empty && $B fetch -C /tmp/empty | tee /tmp/fetch.out
          grep -q 'potion-retrieval-32M ready' /tmp/fetch.out
          $B tinymodel "turn a model into a dict" -C crates/lockdocs-core/tests/fixture | grep -q to_dict
      - name: Docs build
        run: bun run docs:build

  # The one required check.
  ci:
    if: always()
    needs: [plain-language, test, windows, checks]
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do test "$r" = success; done
