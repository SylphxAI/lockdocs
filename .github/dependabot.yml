# bench/projects pins old library versions on purpose (the benchmark compares
# versions; they are installed with --ignore-scripts on CI runners and never
# shipped), and the test fixtures are fake packages: keep both out of updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    exclude-paths: ["bench/projects/**", "crates/lockdocs-core/tests/**"]
    schedule: { interval: monthly }
  - package-ecosystem: cargo
    directory: "/"
    exclude-paths: ["bench/projects/**", "crates/lockdocs-core/tests/**"]
    schedule: { interval: monthly }
  - package-ecosystem: pip
    directory: "/"
    exclude-paths: ["bench/projects/**", "crates/lockdocs-core/tests/**"]
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
