name: release

# Publishes when packages/lockdocs/package.json carries a version that is not
# on npm yet, through the shared mcp-kit release workflow: native binaries ->
# npm (trusted publishing, OIDC) -> npx smoke -> GitHub release -> MCP Registry.
# Bump with `bun scripts/set-version.ts X.Y.Z && cargo update -w`. npm trusted
# publishing trusts this file (SylphxAI/lockdocs, release.yml). The crates job
# publishes lockdocs-core, then lockdocs, to crates.io through trusted
# publishing (OIDC, no token); crates.io trusts this file and the crates-io
# environment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  crates:
    # An owner enables this only after registry ownership and both trusted
    # publisher records have been confirmed. Landing this workflow publishes nothing.
    if: github.ref == 'refs/heads/main' && vars.CRATES_IO_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Skip versions that are already on crates.io
        id: plan
        run: |
          V=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "lockdocs"))')
          if curl -fsS "https://index.crates.io/lo/ck/lockdocs" | grep -q "\"vers\":\"$V\""; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - id: auth
        if: steps.plan.outputs.publish == 'true'
        # Trusted publishing (OIDC): the short-lived token comes from crates.io
        # for this exact workflow, repository and environment. lockdocs-core and
        # lockdocs already exist on crates.io, so no long-lived token is used or
        # needed here — a missing trusted publisher fails loudly instead.
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish lockdocs-core before lockdocs
        if: steps.plan.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --workspace

  release:
    uses: SylphxAI/mcp-kit/.github/workflows/release.yml@bfbaa7ed4be68018831ac1492d6c2e4521489612 # v0
    permissions:
      contents: write
      id-token: write
      packages: write
    # Only the tap/bucket publisher credentials reach the shared workflow.
    secrets:
      TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
      TAP_APP_PRIVATE_KEY: ${{ secrets.TAP_APP_PRIVATE_KEY }}
    with:
      name: lockdocs
      npm-package: '@sylphx/lockdocs'
      mcp-name: io.github.SylphxAI/lockdocs
      mcpb: true
      homebrew: true
      scoop: true
      # A real project: zod pinned in a lockfile.
      smoke: |
        export LOCKDOCS_OFFLINE=1 LOCKDOCS_EMBED=0
        export LOCKDOCS_CACHE="$(mktemp -d)"
        npm init -y >/dev/null
        npm install --silent zod@3.23.8
        npx -y "@sylphx/lockdocs@$V" version
        npx -y "@sylphx/lockdocs@$V" resolve | tee resolve.out
        grep -q 'zod@3.23.8' resolve.out
        npx -y "@sylphx/lockdocs@$V" zod "reject unknown keys" | tee docs.out
        grep -q 'zod@3.23.8 README.md' docs.out
        npx -y "@sylphx/lockdocs@$V" api z.object | grep -q 'ZodObject'
        for ZOD in 3.25.76 4.1.5 4.6.7; do
          npm install --silent --ignore-scripts --no-audit --no-fund "zod@$ZOD"
          npx -y "@sylphx/lockdocs@$V" docs 'reject unknown keys' --pkg zod --json > docs.json
          python3 - "$ZOD" <<'PY'
        import json, sys
        version = sys.argv[1]
        answer = json.load(open('docs.json'))
        hits = [h for h in answer['hits'] if h['kind'] != 'doc']
        assert answer['packages'] == ['zod@' + version], answer
        assert hits and all(h['file'].startswith('v' + version[0] + '/') for h in hits), answer
        assert any('strict' in h['path'].lower() for h in hits[:5]), answer
        PY
          npx -y "@sylphx/lockdocs@$V" api z.strictObject --pkg zod | grep -q 'strictObject'
        done
        npm install --silent --ignore-scripts --no-audit --no-fund next@14.2.35 react@18.3.1 react-dom@18.3.1
        npx -y "@sylphx/lockdocs@$V" api cookies --pkg next/headers | grep -q 'cookies(): ReadonlyRequestCookies'
        npx -y "@sylphx/lockdocs@$V" docs cookies --pkg next --tokens 4000 --json > legacy-docs.json
        python3 - <<'PY'
        import json
        answer = json.load(open('legacy-docs.json'))
        assert answer['packages'] == ['next@14.2.35'], answer
        assert any(h['path'] == 'cookies' and h['file'] == 'dist/client/components/headers.d.ts' for h in answer['hits']), answer
        PY
