name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plain-language:
    name: plain language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/plain-language@f9176dad2e49c6b99d75f1506fafac84632fe870

  identifiers:
    name: Identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Not skipped at job level: a skipped matrix job reports an unexpanded
    # name and would leave the required `test (<os>)` checks pending. Instead
    # the job always runs and its heavy steps are skipped for pull requests
    # that touch only files no test reads.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: c
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'
              - '!CHANGELOG.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request' || steps.c.outputs.code != 'false'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: github.event_name != 'pull_request' || steps.c.outputs.code != 'false'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: github.event_name != 'pull_request' || steps.c.outputs.code != 'false'
      - run: cargo test --workspace --locked
        if: github.event_name != 'pull_request' || steps.c.outputs.code != 'false'

  checks:
    name: manifests, smoke, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bun install --frozen-lockfile
      - name: Manifests agree on one version and one tagline; capability paths exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/check-version.ts
          bun scripts/editor-install.ts --check
          bun scripts/check-tagline.ts "$(gh api "repos/$GITHUB_REPOSITORY" --jq .description)"
          bun scripts/check-capabilities.ts
      - name: Format and lints
        run: cargo fmt --all --check && cargo clippy --workspace --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked -p lockdocs
      - name: Smoke (CLI, MCP over stdio, npm launcher)
        env:
          LOCKDOCS_NO_SYSTEM_PYTHON: '1'
          LOCKDOCS_OFFLINE: '1'
        run: |
          set -euo pipefail
          B=$PWD/target/release/lockdocs
          F=crates/lockdocs-core/tests/fixture
          $B version
          $B resolve -C $F | tee /tmp/resolve.out
          grep -q 'tinyrt@0.3.0' /tmp/resolve.out
          $B tiny-schema "reject unknown keys" -C $F | tee /tmp/docs.out
          grep -q 'tiny-schema@1.2.0 README.md:9' /tmp/docs.out
          $B api tinyrt::spawn -C $F | grep -q 'Spawns a future'
          $B api serde_json::from_str | grep -q 'serde_json@'
          $B index -C $F
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"docs","arguments":{"query":"turn a model into a dict","package":"tinymodel"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"api","arguments":{"symbol":"tinyweb.Context.JSON"}}}' \
            | (cat; sleep 2) | $B mcp -C $F > /tmp/mcp.out
          grep -q '"name":"resolve"' /tmp/mcp.out
          grep -q 'to_dict' /tmp/mcp.out
          grep -q 'JSON writes obj as JSON' /tmp/mcp.out
          HOME=$(mktemp -d) $B setup --client cursor,codex | tee /tmp/setup.out
          grep -q 'Cursor' /tmp/setup.out
          LOCKDOCS_BIN=$B node packages/lockdocs/bin/lockdocs.js version
      - name: Embedding model download, verification and hybrid query
        env:
          LOCKDOCS_NO_SYSTEM_PYTHON: '1'
        run: |
          set -euo pipefail
          B=$PWD/target/release/lockdocs
          mkdir -p /tmp/empty && $B fetch -C /tmp/empty | tee /tmp/fetch.out
          grep -q 'potion-retrieval-32M ready' /tmp/fetch.out
          $B tinymodel "turn a model into a dict" -C crates/lockdocs-core/tests/fixture | grep -q to_dict
      - name: Docs build
        run: bun run docs:build
      - name: Brand home (hashes and surface copies agree)
        uses: SylphxAI/.github/.github/actions/brand@a6c81b4bcda66bf624f0a68e25e63b3c0ed043eb # shared brand generator
