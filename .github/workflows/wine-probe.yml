name: wine-probe
on:
  push:
    branches: [ci/own-runners]
jobs:
  probe:
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    steps:
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: llvm-tools
      - name: hello.exe
        run: |
          set -euo pipefail
          mkdir -p $RUNNER_TEMP/bin; curl -fsSL https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz | tar -xz -C $RUNNER_TEMP/bin cargo-xwin
          export PATH=$RUNNER_TEMP/bin:$PATH
          cd $RUNNER_TEMP && cargo new -q hello && cd hello && XWIN_ACCEPT_LICENSE=1 cargo xwin build -q --release --target x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/hello.exe $RUNNER_TEMP/
      - name: portable wow64 wine
        run: |
          time curl -fsSL -o $RUNNER_TEMP/wine.txz https://github.com/Kron4ek/Wine-Builds/releases/download/11.18/wine-11.18-amd64-wow64.tar.xz
          time tar -xJf $RUNNER_TEMP/wine.txz -C $RUNNER_TEMP
          W=$RUNNER_TEMP/wine-11.18-amd64-wow64/bin
          ls $W
          ldd $W/wine | grep 'not found' || echo "no missing libs for wine"
          $W/wine --version || echo "FAIL $?"
          time (WINEPREFIX=$RUNNER_TEMP/wp WINEDEBUG=-all $W/wine $RUNNER_TEMP/hello.exe; echo "exit=$?")
          time (WINEPREFIX=$RUNNER_TEMP/wp WINEDEBUG=-all $W/wine $RUNNER_TEMP/hello.exe; echo "exit=$?")
