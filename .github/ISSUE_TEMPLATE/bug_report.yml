name: Bug report
description: Report a reproducible lockdocs problem.
labels:
- bug
- owner:sylphx-oss
body:
- type: markdown
  attributes:
    value: 'Search existing issues first. Use [Discussions](https://github.com/SylphxAI/lockdocs/discussions)
      for questions. Reports are public: use synthetic/public examples and redact secrets, personal data
      and private source material. Report vulnerabilities through the [security policy](https://github.com/SylphxAI/lockdocs/security/policy),
      not a public issue.'
- type: textarea
  id: environment
  attributes:
    label: Version and environment
    description: Include `lockdocs version`, installation method (npm, native binary or Cargo), OS/architecture,
      package-manager version and MCP client version if relevant.
  validations:
    required: true
- type: textarea
  id: configuration
  attributes:
    label: Command, tool arguments and configuration
    description: CLI command or MCP tool name and JSON arguments; project root, ecosystem, lockfile format,
      package@version, installation layout, offline/fetch/embedding mode and token budget. Redact private
      package names and registry URLs.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Minimal reproduction
    description: 'Numbered steps and a minimal public or synthetic project: relevant lockfile entries,
      installed package layout, query or API symbol. Include whether fetching was enabled and whether
      the installed version matches the lockfile version.'
  validations:
    required: true
- type: textarea
  id: result
  attributes:
    label: Expected and actual behavior
    description: Show the expected version-correct documentation/API and the actual answer, including
      package@version path:line citations.
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Redacted logs
    description: Paste only the relevant error/output. Remove tokens, credentials, personal paths and
      private content; leave this blank if there are no useful logs.
  validations:
    required: false
