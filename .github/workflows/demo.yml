name: demo

# Records the README demo GIF with VHS from real installs; download the
# `demo` artifact and commit it as docs/public/img/demo.gif.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/demo.tape'
      - '.github/workflows/demo.yml'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: cargo build --release --locked -p lockdocs
      - name: Install the demo projects
        run: |
          set -euo pipefail
          for p in next14 next15; do (cd bench/projects/$p && npm install --ignore-scripts --no-audit --no-fund --silent); done
          for p in pydantic1 pydantic2; do python3 -m venv bench/projects/$p/.venv && bench/projects/$p/.venv/bin/pip install -q -r bench/projects/$p/requirements.txt; done
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          # Warm the per-version caches so the recording shows query time, not indexing.
          for p in next14 next15 pydantic1 pydantic2; do target/release/lockdocs index -C bench/projects/$p >/dev/null; done
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2
        with:
          path: docs/demo.tape
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo
          path: |
            docs/public/img/demo.gif
            docs/public/img/demo.mp4
            docs/public/img/demo-poster.png
          if-no-files-found: error
