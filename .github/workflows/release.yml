name: release

# Publishes when packages/lockdocs/package.json carries a version that is not
# on npm yet, through the shared mcp-kit release workflow: native binaries ->
# npm (trusted publishing, OIDC) -> npx smoke -> GitHub release -> MCP Registry.
# Bump with `bun scripts/set-version.ts X.Y.Z && cargo update -w`. npm trusted
# publishing trusts this file (SylphxAI/lockdocs, release.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: SylphxAI/mcp-kit/.github/workflows/release.yml@v0
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      name: lockdocs
      npm-package: '@sylphx/lockdocs'
      mcp-name: io.github.SylphxAI/lockdocs
      # A real project: zod pinned in a lockfile.
      smoke: |
        npm init -y >/dev/null
        npm install --silent zod@3.23.8
        npx -y "@sylphx/lockdocs@$V" version
        npx -y "@sylphx/lockdocs@$V" resolve | tee resolve.out
        grep -q 'zod@3.23.8' resolve.out
        npx -y "@sylphx/lockdocs@$V" zod "reject unknown keys" | tee docs.out
        grep -q 'zod@3.23.8 README.md' docs.out
        npx -y "@sylphx/lockdocs@$V" api z.object | grep -q 'ZodObject'
